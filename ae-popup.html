.overlay{position:fixed;inset:0;background:var(--backdrop);display:grid;place-items:center;transition:opacity .25s ease}
.overlay.closed{opacity:0;pointer-events:none}

/* pop-up */
.modal{position:relative;display:flex;width:730px;height:548px;background:var(--panel);border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);transition:transform .25s ease}
.overlay.closed .modal{transform:scale(.97)}
.modal .photo{display:block;width:400px;height:548px;flex:none;object-fit:cover}
.panel{position:relative;width:330px;flex:none;padding:61px 30px 0;text-align:center}

.close{position:absolute;top:22px;right:23px;width:25px;height:25px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:4px}
.close svg{width:15px;height:15px}

h1{margin:0;font-size:25.5px;line-height:29px;font-weight:700;letter-spacing:.005em;color:var(--ink)}
.sub{margin:13px 0 0;font-size:12.5px;line-height:16px;font-weight:400;letter-spacing:.07em;color:var(--sub)}

form{margin:0}
.email{display:block;width:270px;height:50px;margin:22px 0 0;padding:0 14px;border:2px solid var(--line);border-radius:4px;font:400 15.5px/1 var(--font);letter-spacing:.02em;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.email::placeholder{color:var(--ph);opacity:1}
.email:focus{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(37,39,42,.35)}

.toggles{margin-top:29px;display:flex;flex-direction:column;gap:16px}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;width:max-content;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.track{position:relative;width:52px;height:31px;flex:none;border-radius:999px;background:#C8C9CB;transition:background .2s ease}
.track::after{content:"";position:absolute;top:1.5px;left:1.5px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .2s ease}
.tg input:checked + .track{background:var(--ink)}
.tg input:checked + .track::after{transform:translateX(21px)}
.tg input:focus-visible + .track{outline:2px solid var(--ink);outline-offset:3px}
.tg span.t{font-size:15px;font-weight:700;letter-spacing:.015em;color:var(--ink)}

.cta{display:block;width:270px;height:50px;margin-top:29px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 14.5px/1 var(--font);letter-spacing:.03em;cursor:pointer;transition:background .15s ease}
.cta:hover{background:#000}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.legal{margin:21px -6px 0;font-size:10.5px;line-height:14px;letter-spacing:.02em;color:var(--sub)}
.legal a{color:var(--sub);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.legal a:hover{color:var(--ink)}

.reopen{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
.reopen.show{opacity:1;pointer-events:auto;transform:none}
.reopen svg{width:22px;height:22px}

@media (prefers-reduced-motion:reduce){.overlay,.modal,.track,.track::after,.reopen{transition:none}}
</style>
</head>

      <p class="sub">when you sign up for email</p>

      <form id="signup" novalidate>
        <input class="email" id="email" type="email" name="email" placeholder="Email" autocomplete="email" aria-label="Email">
        <div class="toggles">
          <label class="tg"><input type="checkbox" name="ae" checked><span class="track"></span><span class="t">AE Emails</span></label>
          <label class="tg"><input type="checkbox" name="aerie" checked><span class="track"></span><span class="t">Aerie Emails</span></label>

  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.8 7l8.2 6 8.2-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
</button>

<script>
(function(){
  var ov=document.getElementById('overlay'), modal=document.getElementById('modal'),
      reopen=document.getElementById('reopen'), email=document.getElementById('email');
  function fit(){
    var w=document.documentElement.clientWidth, h=window.innerHeight;
    modal.style.zoom=Math.min(1,(w-24)/730,(h-24)/548);
  }
  function close(){ov.classList.add('closed');reopen.classList.add('show');reopen.focus();}
  function open(){ov.classList.remove('closed');reopen.classList.remove('show');email.focus();}
  document.getElementById('closeBtn').addEventListener('click',close);
  reopen.addEventListener('click',open);
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.classList.contains('closed'))close();});
  document.getElementById('signup').addEventListener('submit',function(e){
    e.preventDefault();
    if(!email.checkValidity()||!email.value){email.focus();email.style.borderColor='#C8102E';return;}
    email.style.borderColor='';
  });
  email.addEventListener('input',function(){email.style.borderColor='';});
  fit(); window.addEventListener('resize',fit);
})();
</script>
