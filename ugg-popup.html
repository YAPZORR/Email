<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGG signup popup</title>
<style>
/* AktivGrotesk is a licensed font. If it's installed on this computer, or if
   the licensed files are placed in a "fonts" folder next to this file, the
   page uses it. Otherwise it falls back to Helvetica Neue / Arial. */
@font-face{font-family:"AktivGrotesk";font-weight:300;font-style:normal;font-display:swap;
  src:local("Aktiv Grotesk Light"),local("AktivGrotesk-Light"),url("fonts/AktivGrotesk-Light.woff2") format("woff2"),url("fonts/AktivGrotesk-Light.woff") format("woff")}
@font-face{font-family:"AktivGrotesk";font-weight:400;font-style:normal;font-display:swap;
  src:local("Aktiv Grotesk"),local("AktivGrotesk-Regular"),url("fonts/AktivGrotesk-Regular.woff2") format("woff2"),url("fonts/AktivGrotesk-Regular.woff") format("woff")}
@font-face{font-family:"AktivGrotesk";font-weight:700;font-style:normal;font-display:swap;
  src:local("Aktiv Grotesk Bold"),local("AktivGrotesk-Bold"),url("fonts/AktivGrotesk-Bold.woff2") format("woff2"),url("fonts/AktivGrotesk-Bold.woff") format("woff")}

:root{
  --ink:#000000;
  --btn:#111111;
  --line:#979797;
  --hint:#767676;
  --close:#333333;
  --font:"AktivGrotesk","Aktiv Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#24211F;-webkit-font-smoothing:antialiased}

/* page dimmer behind the popup */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(0,0,0,.55);transition:opacity .2s ease}
.overlay[hidden]{display:flex;opacity:0;pointer-events:none}

/* popup */
.popup{position:relative;flex:none;display:flex;width:800px;height:600px;background:#fff;overflow:hidden}
.popup-photo{flex:0 0 400px;width:400px;height:600px;object-fit:cover;object-position:center}
.popup-panel{position:relative;flex:0 0 400px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}

.close{position:absolute;top:3px;right:3px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;color:var(--close)}
.close svg{width:15px;height:15px}

.logo{width:96px;height:auto;margin-top:40px;display:block}
.lead{font-size:18px;line-height:24px;font-weight:300}
.lead-top{margin-top:34px}
.offer{font-size:32px;line-height:35.5px;font-weight:700;margin-top:8px}
.lead-bottom{margin-top:7.5px}

.form{width:352px;margin-top:40.5px;display:flex;flex-direction:column;gap:16px}
.field{width:100%;height:50px;border:1px solid var(--line);border-radius:4px;padding:0 17px;font:400 16px var(--font);color:var(--ink);background:#fff;outline:none}
.field::placeholder{color:var(--hint);opacity:1}
.field:focus{border-color:var(--btn);box-shadow:0 0 0 1px var(--btn)}
.submit{width:100%;height:64px;border:0;border-radius:4px;background:var(--btn);color:#fff;font:700 21px var(--font);cursor:pointer}
.submit:hover{background:#2a2a2a}
.close:focus-visible,.submit:focus-visible,.reopen:focus-visible{outline:2px solid #4D90FE;outline-offset:2px}

.reopen{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font:700 14px var(--font);background:#fff;color:#000;border:0;border-radius:4px;padding:12px 18px;cursor:pointer}
.reopen[hidden]{display:none}

/* small screens: stack photo over the form */
@media (max-width:811px){
  .overlay{padding:16px}
  .popup{flex-direction:column;width:min(400px,100%);height:auto;max-height:calc(100vh - 32px);overflow-y:auto}
  .popup-photo{flex:none;width:100%;height:220px;object-position:center 30%}
  .popup-panel{flex:none;padding:0 24px 32px}
  .logo{margin-top:28px}
  .form{width:100%}
}
@media (prefers-reduced-motion:reduce){.overlay{transition:none}}
</style>
</head>

<button class="reopen" type="button" id="reopen" hidden>Show popup</button>

<script>
(function(){
  var overlay=document.getElementById('overlay'),reopen=document.getElementById('reopen'),
      closeBtn=document.getElementById('close'),form=document.getElementById('form');
  function close(){overlay.hidden=true;reopen.hidden=false;reopen.focus();}
  function open(){overlay.hidden=false;reopen.hidden=true;closeBtn.focus();}
  closeBtn.addEventListener('click',close);
  reopen.addEventListener('click',open);
  overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden)close();});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var f=form.elements.email;
    if(!f.checkValidity()){f.focus();f.style.borderColor='#C8102E';return;}
    f.style.borderColor='';
  });
})();
</script>
