<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontier vial carousel</title>
<style>
  :root {
    color-scheme: dark;
    --page: #053E47;                 /* page background */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #053E47; } }
  :root[data-theme="dark"] { --page: #053E47; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { background: var(--page); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* The stage is transparent and scales to fit the window. */
  .vial-stage { position: relative; flex: none; width: 1200px; height: 936px; background: transparent; }
  .vial-stage .world {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 936px;
    transform-origin: 0 0;
    transform: scale(var(--k, 1));
  }
  .vial-stage .glow,
  .vial-stage .vial {
    position: absolute; left: 0; top: 0;
    user-select: none; pointer-events: none; -webkit-user-drag: none;
  }
  .vial-stage .glow { width: 1200px; height: 936px; }
  .vial-stage .vial { transform-origin: 50% 50%; will-change: transform, filter, opacity; }
</style>
</head>
<body>
<div class="vial-stage" id="vial-stage" role="img" aria-label="Frontier Biomed vials taking turns at the center of a teal glow">
  <div class="world">
    <img class="glow" id="stage-glow" alt="" draggable="false">
  </div>
</div>

<script>
/* ============================================================
   Frontier vial carousel
   ============================================================ */
(() => {
  'use strict';

  // ---------- VIALS: one image per bottle ----------
  // Listed in the order each bottle arrives in the center.
  // Each entry is either the name of an image in STAGE_ASSETS.images (bottom of this file)
  // or any image URL / data: URI. Use cut-out PNG or WebP files with a transparent background;
  // they are trimmed and sized automatically.
  const VIALS = [
    'll37',   // Vial 1: starts in the center
    'll37',   // Vial 2: starts top-left, comes to the center next
    'll37',   // Vial 3: starts bottom-left
    'll37',   // Vial 4: starts bottom-right
    'll37',   // Vial 5: starts top-right
  ];

  // ---------- Motion ----------
  const TIMING = { holdMs: 1500, moveMs: 1400 };   // pause on each vial, then the move
  const VIAL_HEIGHT = 710;                          // center vial height, in stage units (stage = 1200 × 936)

  // Resting slots, matched to the original artwork. r = tilt in degrees (positive leans left),
  // b = blur in stage px, o = opacity.
  const SLOTS = {
    C:  { x: 600.0,  y: 486.0, s: 1.000, r:   0.00, b: 0.00, o: 1.000 },
    TR: { x: 1055.1, y: 197.1, s: 0.278, r: -20.05, b: 5.23, o: 0.535 },
    BR: { x: 1090.3, y: 775.5, s: 0.248, r: -36.18, b: 6.01, o: 0.443 },
    BL: { x: 123.7,  y: 761.9, s: 0.250, r:  39.57, b: 5.64, o: 0.437 },
    TL: { x: 161.8,  y: 214.3, s: 0.301, r:  21.97, b: 5.78, o: 0.554 },
  };
  const ORDER = ['C', 'TR', 'BR', 'BL', 'TL'];      // clockwise: center → top-right → … → top-left → center
  const CURVE = {                                    // control point of each curved path
    'C>TR': [905, 470], 'TR>BR': [1172, 486], 'BR>BL': [600, 822], 'BL>TL': [22, 488], 'TL>C': [295, 470],
  };
  const DIP = { 'BR>BL': 0.03 };                     // that pass runs "behind", a touch smaller and softer
  // -----------------------------------

  const stage = document.getElementById('vial-stage');
  const world = stage.querySelector('.world');
  const vials = [];
  let products = [];
  let paused = false, pausedAt = 0, startTime = performance.now();
  let lastKey = '';

  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const lerp = (a, b, t) => a + (b - a) * t;

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Could not load vial image: ' + src.slice(0, 80)));
      img.src = src;
    });
  }

  /** Trim transparent margins so every vial lines up. Resolves {src, w, h}. */
  async function prepare(src) {
    const img = await loadImage(src);
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    let data;
    try { data = ctx.getImageData(0, 0, W, H).data; }
    catch (e) { return { src, w: W, h: H }; }          // image from another site without CORS: used untrimmed
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (data[(y * W + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0 || (x0 === 0 && y0 === 0 && x1 === W - 1 && y1 === H - 1)) return { src, w: W, h: H };
    const out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return { src: out.toDataURL('image/png'), w: out.width, h: out.height };
  }

  async function loadVials() {
    const images = (window.STAGE_ASSETS && window.STAGE_ASSETS.images) || {};
    const cache = new Map();
    const list = [];
    for (const entry of VIALS) {
      const src = images[entry] || entry;
      if (!cache.has(src)) cache.set(src, prepare(src).catch((e) => { console.warn(e.message); return null; }));
      list.push(await cache.get(src));
    }
    products = list.filter(Boolean);
    applyProducts();
  }

  function buildVials() {
    for (let i = 0; i < 5; i++) {
      const img = document.createElement('img');
      img.className = 'vial'; img.alt = ''; img.draggable = false; img.decoding = 'async';
      world.appendChild(img);
      vials.push(img);
    }
  }

  // Bottle i reaches the center on the cycle where (i + cycle) % 5 === 0, i.e. in the order 0, 4, 3, 2, 1.
  // VIALS is handed out in that order, so the list above matches what you see in the center.
  function productFor(i) {
    const k = products.length;
    return k ? products[((5 - i) % 5) % k] : null;
  }

  function applyProducts() {
    vials.forEach((img, i) => {
      const p = productFor(i);
      if (!p) return;
      const h = VIAL_HEIGHT, w = Math.round(VIAL_HEIGHT * p.w / p.h);
      img.dataset.w = w; img.dataset.h = h;
      img.style.width = w + 'px'; img.style.height = h + 'px';
      if (img.src !== p.src) img.src = p.src;
    });
    lastKey = '';
    draw(currentTime());
  }

  function stateAt(from, to, t) {
    const e = ease(t);
    const a = SLOTS[from], b = SLOTS[to], key = from + '>' + to;
    const c = CURVE[key];
    const u = 1 - e;
    const x = u * u * a.x + 2 * u * e * c[0] + e * e * b.x;
    const y = u * u * a.y + 2 * u * e * c[1] + e * e * b.y;
    const dip = (DIP[key] || 0) * Math.sin(Math.PI * e);
    return {
      x, y,
      s: lerp(a.s, b.s, e) - dip,
      r: lerp(a.r, b.r, e),
      b: lerp(a.b, b.b, e) + dip * 40,
      o: lerp(a.o, b.o, e) - dip * 1.2,
    };
  }

  function draw(ms) {
    const period = TIMING.holdMs + TIMING.moveMs;
    const cycle = Math.floor(ms / period);
    const local = ms - cycle * period;
    const t = local < TIMING.holdMs ? 0 : (local - TIMING.holdMs) / TIMING.moveMs;
    const key = cycle % 5 + ':' + t.toFixed(4);
    if (key === lastKey) return;          // nothing moves during the hold
    lastKey = key;
    vials.forEach((img, i) => {
      const slot = (i + cycle) % 5;
      const st = stateAt(ORDER[slot], ORDER[(slot + 1) % 5], t);
      const w = +img.dataset.w || 310, h = +img.dataset.h || VIAL_HEIGHT;
      img.style.transform =
        `translate3d(${(st.x - w / 2).toFixed(2)}px, ${(st.y - h / 2).toFixed(2)}px, 0) rotate(${(-st.r).toFixed(3)}deg) scale(${st.s.toFixed(4)})`;
      img.style.opacity = st.o.toFixed(3);
      // CSS blur happens before the scale, so divide to get the on-stage blur
      const blur = st.b / st.s;
      img.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
      img.style.zIndex = String(Math.round(st.s * 1000));
    });
  }

  function currentTime() { return paused ? pausedAt : performance.now() - startTime; }

  function loop() {
    if (!paused) draw(currentTime());
    requestAnimationFrame(loop);
  }

  // Scale the stage to fit the window
  function fit() {
    const k = Math.min(document.body.clientWidth / 1200, document.body.clientHeight / 936);
    stage.style.width = (1200 * k).toFixed(2) + 'px';
    stage.style.height = (936 * k).toFixed(2) + 'px';
    world.style.setProperty('--k', k.toFixed(5));
  }

  function init() {
    world.querySelector('#stage-glow').src = window.STAGE_ASSETS.stage;
    buildVials();
    fit();
    requestAnimationFrame(loop);
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(document.body);
    window.addEventListener('resize', fit);
    loadVials();

    // for developers: vialStage.pause(), vialStage.play(), vialStage.seek(ms)
    window.vialStage = {
      pause() { if (!paused) { pausedAt = currentTime(); paused = true; } },
      play() { if (paused) { startTime = performance.now() - pausedAt; paused = false; } },
      seek(ms) { pausedAt = ms; paused = true; lastKey = ''; draw(ms); },
      timing: TIMING,
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
